name: CPU JIT

on:
  push:
    branches: [main, fix/eredu-runtime-safety]
  pull_request:

jobs:
  macos-cpu:
    # The Apple silicon LLVM bundle contains AArch64 but no AMDGPU target.
    # Running an executable catches link dependencies that cargo check misses.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: tracel-ai/github-actions/install-rust@v11
        with:
          rust-toolchain: stable
          cache-key: cpu-jit-macos
      - name: Link and execute CPU kernels
        run: cargo test --locked -p cubecl-cpu --test cpu_jit
